# East Bay (Oakland / Berkeley / Alameda / Lamorinda) reference data for Rental Radar.
#
# Neighborhood scores (1-10) are one household's judgment blend of safety, family-friendliness,
# walkability/amenities and day-to-day livability, made in late 2026. They are approximate and
# opinionated: re-rate them for your own priorities, and verify specific blocks with crime maps
# and a video walk-through. They rate fit for one family's search, not the people who live there;
# notes about crime summarize public city statistics from that time, vary block by block, and go
# out of date. Commute is scored per listing, so notes here don't mention it.

default_score: 5.5

